ar:"ရင်းနှီးသော",culture:"ယဉ်ကျေးမှု",reticent:"စကားနည်းသော","video conferencing":"ရုပ်သံဖြင့် အစည်းအဝေးပြုလုပ်ခြင်း",opportunity:"အခွင့်အလမ်း",abroad:"နိုင်ငံခြား","surfing the net":"အင်တာနက်ကြည့်ခြင်း","formal context":"တရားဝင်သော အခြေအနေ","formal contexts":"တရားဝင်သော အခြေအနေများ",salesman:"အရောင်းသမား",salesperson:"အရောင်းဝန်ထမ်း","parental talk":"မိဘ၏ စကားပြောခြင်း",interact:"ဆက်ဆံသည်"
};

var D=[
[["Communication skills are the abilities to convey our ideas, feelings, attitudes, perceptions, wants, needs, knowledge, etc. in a precise and lucid manner in accordance with the intention of the person communicating the message, either in the spoken, or written form, face-to-face or via communication devices, such as phone, e-mail, and video conferencing.","ဆက်သွယ်ပြောဆိုနိုင်စွမ်းဆိုသည်မှာ ကျွန်ုပ်တို့၏ အတွေး၊ ခံစားချက်၊ သဘောထား၊ အမြင်၊ လိုချင်မှု၊ လိုအပ်ချက်၊ အသိပညာ စသည်တို့ကို ပေးပို့သူ၏ ရည်ရွယ်ချက်နှင့်အညီ တိကျပြတ်သားပြီး ရှင်းလင်းစွာ ပြောဆိုဖြစ်စေ ရေးသားဖြစ်စေ၊ မျက်နှာချင်းဆိုင်ဖြစ်စေ၊ ဖုန်း၊ အီးမေးလ်၊ ရုပ်သံဖြင့် အစည်းအဝေးပြုလုပ်ခြင်းကဲ့သို့ ကိရိယာများမှတစ်ဆင့်ဖြစ်စေ ပေးပို့နိုင်သော စွမ်းရည်များ ဖြစ်သည်။"],
["Since communication is usually a two-way interaction between two or more persons, one must also include listening and reading skills among the communication skills.","ဆက်သွယ်ပြောဆိုမှုသည် များသောအားဖြင့် လူနှစ်ဦးနှင့်အထက်ကြား နှစ်ဖက်အပြန်အလှန် ဆက်ဆံမှု ဖြစ်သောကြောင့် ဆက်သွယ်ပြောဆိုနိုင်စွမ်းများတွင် နားထောင်ခြင်းနှင့် ဖတ်ခြင်း စွမ်းရည်များကိုပါ ထည့်သွင်းရမည်။"]],
[["Communication is not just merely using words.","ဆက်သွယ်ပြောဆိုခြင်းဆိုသည်မှာ စကားလုံးများကို သုံးရုံသက်သက် မဟုတ်ပါ။"],
["Spoken communication also involves the use of a variety of features to express different nuances of meaning such as body language which includes facial expressions, posture, gestures; tone of voice; eye contact; proximity between speaker and listener, etc.","ပြောဆိုဆက်သွယ်ရာတွင် မျက်နှာအမူအရာ၊ ထိုင်နေပုံ၊ လက်ဟန်ခြေဟန်ပါဝင်သော ခန္ဓာကိုယ်ဘာသာစကား၊ အသံနေအသံထား၊ မျက်လုံးချင်းဆုံမှု၊ ပြောသူနှင့် နားထောင်သူကြား အကွာအဝေး စသည့် အချက်အမျိုးမျိုးကို သုံး၍ အဓိပ္ပာယ်၏ ကွဲပြားသော အရောင်အသွေးများကို ဖော်ပြသည်။"],
["On the other hand, written communication exploits choice of word, order of words, sentence patterns, the sound system of the language concerned, the organisation of texts, size and design of letters of the alphabet, etc. to gain specific communicative effects.","အခြားတစ်ဖက်တွင် ရေးသားဆက်သွယ်မှုသည် စကားလုံးရွေးချယ်မှု၊ စကားလုံးအစီအစဉ်၊ ဝါကျပုံစံများ၊ သက်ဆိုင်ရာဘာသာစကား၏ အသံစနစ်၊ စာသားဖွဲ့စည်းပုံ၊ အက္ခရာစာလုံးများ၏ အရွယ်အစားနှင့် ဒီဇိုင်း စသည်တို့ကို အသုံးချ၍ သီးသန့်ဆက်သွယ်မှု အကျိုးသက်ရောက်မှုများ ရယူသည်။"],
["In addition, an interpretation of human communication is made more complex due to the fact that more than one meaning can be conveyed by a single utterance, and indirectness is frequently used to communicate different shades of meaning including the opposite of what is said.","ထို့အပြင် စကားတစ်ခွန်းတည်းဖြင့် အဓိပ္ပာယ်တစ်မျိုးထက်ပို၍ ဖော်ပြနိုင်ခြင်းနှင့် ပြောသည့်အဓိပ္ပာယ်၏ ဆန့်ကျင်ဘက်အပါအဝင် အဓိပ္ပာယ်အရောင်အသွေးအမျိုးမျိုးကို သွယ်ဝိုက်၍ ဖော်ပြလေ့ရှိခြင်းတို့ကြောင့် လူ့ဆက်သွယ်ပြောဆိုမှုကို အဓိပ္ပာယ်ဖွင့်ဆိုရာတွင် ပိုမိုရှုပ်ထွေးစေသည်။"],
["Moreover, such non-verbal features as the style and colour of one's clothes and hair, and for women and some men, the use of certain kinds of jewellery, make-up, lipstick, perfume, etc. may be employed to subtly convey information about the personality of a person.","ထို့ပြင် အဝတ်အစားနှင့် ဆံပင်၏ ပုံစံနှင့်အရောင်၊ အမျိုးသမီးများနှင့် အချို့အမျိုးသားများအတွက် လက်ဝတ်ရတနာ၊ မိတ်ကပ်၊ နှုတ်ခမ်းနီ၊ ရေမွှေး စသည်တို့ကဲ့သို့ စကားမဟုတ်သော အချက်များကိုလည်း လူတစ်ဦး၏ ကိုယ်ရည်ကိုယ်သွေးအကြောင်း သိမ်မွေ့စွာ ဖော်ပြရန် အသုံးပြုနိုင်သည်။"]],
[["There are many reasons for communication skills to have come to be regarded as a vital life skill in the 21st century.","၂၁ ရာစုတွင် ဆက်သွယ်ပြောဆိုနိုင်စွမ်းကို အရေးပါသော ဘဝစွမ်းရည်အဖြစ် သတ်မှတ်လာရခြင်းအတွက် အကြောင်းရင်းများစွာ ရှိသည်။"],
["Firstly, it would be extremely difficult to fulfil even our most basic needs and wants, as anyone who has had the experience of travelling in a foreign country whose language he or she does not know will attest to.","ပထမအချက်၊ မိမိမသိသော ဘာသာစကားသုံးသည့် နိုင်ငံခြားတွင် ခရီးသွားဖူးသူတိုင်း သက်သေခံနိုင်သကဲ့သို့ အခြေခံလိုအပ်ချက်နှင့် ဆန္ဒများကိုပင် ဖြည့်ဆည်းရန် အလွန်ခက်ခဲမည်။"],
["Secondly, just as our appearance creates the first impression, so does the way we speak and write.","ဒုတိယအချက်၊ ကျွန်ုပ်တို့၏ အသွင်အပြင်က ပထမအမြင်ကို ဖန်တီးသကဲ့သို့ ပြောပုံဆိုပုံနှင့် ရေးပုံသားပုံကလည်း ထိုနည်းတူ ဖန်တီးသည်။"],
["Thirdly, communication skills are important in our social dealings both within the family as well as with friends, acquaintances, and strangers as they can improve relationship or worsen it.","တတိယအချက်၊ ဆက်သွယ်ပြောဆိုနိုင်စွမ်းသည် မိသားစုအတွင်းသာမက သူငယ်ချင်း၊ အသိမိတ်ဆွေနှင့် သူစိမ်းများနှင့် လူမှုဆက်ဆံရာတွင်လည်း အရေးကြီးပြီး ဆက်ဆံရေးကို ကောင်းမွန်စေနိုင်သလို ဆိုးရွားစေနိုင်သည်။"],
["Fourthly, good communication skills are required by many jobs, especially those that relate to dealing with the public, whether it is the position of a salesperson, or that of a CEO, as seen from the many job advertisements in newspapers.","စတုတ္ထအချက်၊ သတင်းစာများရှိ အလုပ်ခေါ်စာများစွာတွင် တွေ့ရသကဲ့သို့ အရောင်းဝန်ထမ်းမှ CEO အထိ လူထုနှင့်ဆက်ဆံရသော ရာထူးများအပါအဝင် အလုပ်များစွာတွင် ကောင်းမွန်သော ဆက်သွယ်ပြောဆိုနိုင်စွမ်း လိုအပ်သည်။"],
["Fifthly, the higher the position of a person, the more expertise he or she will need in communication, as he or she has to interact with a wide spectrum of people, including those from other countries and cultures, in different situations.","ပဉ္စမအချက်၊ ရာထူးမြင့်လေ ဆက်သွယ်ပြောဆိုမှုတွင် ကျွမ်းကျင်မှု ပိုလိုလေဖြစ်ပြီး အကြောင်းမှာ အခြားနိုင်ငံများနှင့် ယဉ်ကျေးမှုများမှ လူများအပါအဝင် လူမျိုးစုံနှင့် အခြေအနေအမျိုးမျိုးတွင် ဆက်ဆံရသောကြောင့် ဖြစ်သည်။"]],
[["In Myanmar, with the advent of market economy, expansion of micro, small and medium enterprises, growth in employment opportunities, increase in young people pursuing higher education both at home and abroad, and greater interaction with foreigners and foreign countries for business, tourism and other purposes, effective communication, including the ability to use a foreign language, especially the English language, and the ability to translate and interpret, has risen to the forefront of the skills much in demand these days.","မြန်မာနိုင်ငံတွင် ဈေးကွက်စီးပွားရေး ပေါ်ပေါက်လာခြင်း၊ အသေးစား၊ အလတ်စား စီးပွားရေးလုပ်ငန်းများ တိုးချဲ့လာခြင်း၊ အလုပ်အကိုင်အခွင့်အလမ်းများ တိုးပွားလာခြင်း၊ ပြည်တွင်းပြည်ပတွင် ပညာဆက်လက်သင်ယူသော လူငယ်များ တိုးလာခြင်းနှင့် စီးပွားရေး၊ ခရီးသွားလာရေးနှင့် အခြားရည်ရွယ်ချက်များအတွက် နိုင်ငံခြားသားများ၊ နိုင်ငံခြားနိုင်ငံများနှင့် ပိုမိုဆက်ဆံလာခြင်းတို့နှင့်အတူ နိုင်ငံခြားဘာသာစကား အထူးသဖြင့် အင်္ဂလိပ်ဘာသာကို သုံးနိုင်စွမ်းနှင့် ဘာသာပြန်နိုင်စွမ်း၊ စကားပြန်နိုင်စွမ်းအပါအဝင် ထိရောက်သော ဆက်သွယ်ပြောဆိုမှုသည် ယနေ့ လိုအပ်ချက်အများဆုံး ကျွမ်းကျင်မှုများ၏ ရှေ့ဆုံးသို့ ရောက်လာပြီ ဖြစ်သည်။"]],
[["On the other hand, with more parents going out to work and reduction in the number of extended families, there seems to be less opportunity for young people to communicate with people of different generations or to receive their guidance on how to converse appropriately.","အခြားတစ်ဖက်တွင် အလုပ်ထွက်လုပ်သော မိဘများ ပိုများလာခြင်းနှင့် ဆွေမျိုးစုံမိသားစုများ နည်းလာခြင်းကြောင့် လူငယ်များအတွက် မတူညီသော မျိုးဆက်များနှင့် ဆက်သွယ်ပြောဆိုရန် သို့မဟုတ် သင့်လျော်စွာ စကားပြောနည်း လမ်းညွှန်မှုရရန် အခွင့်အလမ်း နည်းလာသည့်ပုံ ရှိသည်။"],
["This situation is compounded by the fact that a lot of young people in cities spend more time with their cell phones playing games, and surfing the net than talking with other people.","မြို့ပြရှိ လူငယ်များစွာသည် အခြားသူများနှင့် စကားပြောခြင်းထက် ဖုန်းဖြင့် ဂိမ်းဆော့ခြင်းနှင့် အင်တာနက်ကြည့်ခြင်းတွင် အချိန်ပိုကုန်ဆုံးသည့် အချက်ကြောင့် ဤအခြေအနေ ပိုဆိုးလာသည်။"],
["It is my impression that young people need to be trained to overcome their shyness and reticence to talk with persons of different generations and to make appropriate use of the polite forms traditionally used in conversing with older persons and more formal contexts.","ကျွန်ုပ်၏ အမြင်အရ လူငယ်များသည် ရှက်တတ်မှုနှင့် စကားမပြောလိုမှုကို ကျော်လွှား၍ မတူညီသောမျိုးဆက်များနှင့် စကားပြောနိုင်ရန်နှင့် အသက်ကြီးသူများနှင့် စကားပြောရာတွင်၊ တရားဝင်သော အခြေအနေများတွင် ရိုးရာအရ သုံးလေ့ရှိသည့် ယဉ်ကျေးသောစကားအသုံးများကို သင့်လျော်စွာ သုံးတတ်ရန် လေ့ကျင့်ပေးရန် လိုအပ်သည်။"]],
[["Some people have the gift of being able to communicate effectively, but some do not.","လူအချို့မှာ ထိရောက်စွာ ဆက်သွယ်ပြောဆိုနိုင်သော ပင်ကိုယ်ပါရမီ ရှိကြပြီး အချို့မှာ မရှိကြပါ။"],
["However this does not mean that it cannot be developed.","သို့သော် ထိုစွမ်းရည်ကို မြှင့်တင်၍မရဟု မဆိုလိုပါ။"],
["The place to begin training young people to develop communication skills is the home.","လူငယ်များ၏ ဆက်သွယ်ပြောဆိုနိုင်စွမ်းကို လေ့ကျင့်ပေးရန် စတင်ရမည့်နေရာမှာ အိမ်ဖြစ်သည်။"],
["It is important that parents talk with their children as often as possible, not only to stay connected with them but also to develop their language skills.","မိဘများသည် သားသမီးများနှင့် ဆက်သွယ်မှုရှိနေစေရန်သာမက ၎င်းတို့၏ ဘာသာစကားစွမ်းရည်များ တိုးတက်စေရန်ပါ တတ်နိုင်သမျှ မကြာခဏ စကားပြောပေးခြင်းသည် အရေးကြီးသည်။"],
["Through parental talk, children can enrich their stock of vocabulary and sentence patterns and at the same time, develop critical thinking, satisfy their curiosity about their surroundings and expand their knowledge about the world around them.","မိဘ၏ စကားပြောခြင်းမှတစ်ဆင့် ကလေးများသည် စကားလုံးနှင့် ဝါကျပုံစံများကို ကြွယ်ဝစေနိုင်ပြီး တစ်ချိန်တည်းတွင် ဝေဖန်ကြည့်ရှုတတ်သော အတွေးအခေါ်ကို ဖွံ့ဖြိုးစေကာ ပတ်ဝန်းကျင်အပေါ် သိချင်စိတ်ကို ဖြေဆည်းပြီး ကမ္ဘာအကြောင်း အသိပညာကို တိုးချဲ့နိုင်သည်။"],
["When children are old enough, parents should begin teaching them to use more polite language.","ကလေးများ အသက်အရွယ်ရလာသောအခါ မိဘများသည် ပိုမိုယဉ်ကျေးသော စကားအသုံးကို စတင်သင်ကြားပေးသင့်သည်။"]],
[["The goals of schools and universities should include the promotion of effective communication, as it is not just a vital life skill as pointed earlier, but because it is also a skill that will bring academic success.","ကျောင်းများနှင့် တက္ကသိုလ်များ၏ ရည်မှန်းချက်တွင် ထိရောက်သော ဆက်သွယ်ပြောဆိုမှုကို မြှင့်တင်ပေးခြင်း ပါဝင်သင့်သည်။ အကြောင်းမှာ အထက်တွင် ဖော်ပြခဲ့သည့်အတိုင်း အရေးပါသော ဘဝစွမ်းရည်ဖြစ်သည့်အပြင် ပညာရေးအောင်မြင်မှုကိုလည်း ယူဆောင်လာမည့် စွမ်းရည်ဖြစ်သောကြောင့် ဖြစ်သည်။"],
["Communication skills can be taught as part of the Myanmar and English language courses, or it could be integrated in all the subjects that students have to study.","ဆက်သွယ်ပြောဆိုနိုင်စွမ်းကို မြန်မာနှင့် အင်္ဂလိပ်ဘာသာ သင်တန်းများ၏ အစိတ်အပိုင်းအဖြစ် သင်ကြားနိုင်သလို ကျောင်းသားများ လေ့လာရသော ဘာသာရပ်အားလုံးတွင် ပေါင်းစပ်သင်ကြားနိုင်သည်။"],
["The latter has the advantage of giving more opportunity to use communication skills by students across the curriculum and also strengthening linkage among knowledge, cultural norms, thinking and communication which are crucial not only for students but also for those in employment.","နောက်နည်းလမ်းတွင် ကျောင်းသားများအနေဖြင့် သင်ရိုးအားလုံးတွင် ဆက်သွယ်ပြောဆိုနိုင်စွမ်းကို သုံးရန် အခွင့်အလမ်း ပိုရစေခြင်းနှင့် ကျောင်းသားများအတွက်သာမက အလုပ်လုပ်သူများအတွက်ပါ အရေးပါသည့် အသိပညာ၊ ယဉ်ကျေးမှုစံနှုန်းများ၊ အတွေးအခေါ်နှင့် ဆက်သွယ်ပြောဆိုမှုတို့ကြား ဆက်စပ်မှုကို ခိုင်မာစေခြင်းတို့ ပါဝင်သည့် အားသာချက် ရှိသည်။"],
["Below are some of the prerequisites for developing communication skills:","ဆက်သွယ်ပြောဆိုနိုင်စွမ်း မြှင့်တင်ရန်အတွက် ကြိုတင်လိုအပ်ချက်အချို့ကို အောက်တွင် ဖော်ပြထားသည် -"]],
[["1. overcoming shyness, brevity and reluctance to talk, so that one can interact with people one is familiar with as well as strangers","၁။ ရှက်တတ်မှု၊ စကားတိုမှုနှင့် စကားမပြောလိုမှုကို ကျော်လွှား၍ ရင်းနှီးသူများနှင့်ရော သူစိမ်းများနှင့်ပါ ဆက်ဆံနိုင်ရန်"]],
[["2. being aware of the audience - age, gender, job, status, interest, educational background, knowledge, etc., to adjust the style of one's language and topics","၂။ နားထောင်သူ၏ အသက်၊ ကျား/မ၊ အလုပ်၊ အဆင့်အတန်း၊ စိတ်ဝင်စားမှု၊ ပညာအရည်အချင်း၊ အသိပညာ စသည်တို့ကို သတိထား၍ မိမိ၏ ဘာသာစကားပုံစံနှင့် ခေါင်းစဉ်များကို ညှိနိုင်ရန်"]],
[["3. being aware of the setting, the place and the occasion where the interaction is taking place, to make one's communication appropriate to it","၃။ ဆက်ဆံမှု ဖြစ်ပေါ်နေသည့် နေရာနှင့် အခါအခွင့်ကို သတိထား၍ မိမိ၏ပြောဆိုမှုကို သင့်လျော်စေရန်"]],
[["4. having relevant knowledge, vocabulary and structure to interact on a wide range of topics","၄။ ခေါင်းစဉ်အမျိုးမျိုးဖြင့် ဆက်ဆံနိုင်ရန် သက်ဆိုင်ရာ အသိပညာ၊ စကားလုံးနှင့် ဝါကျဖွဲ့စည်းပုံ ရှိထားရန်"]],
[["5. making one's communication informative, so that it will be worth paying attention to","၅။ အာရုံစိုက်ရကျိုးနပ်စေရန် မိမိ၏ပြောဆိုမှုကို အချက်အလက်ပေးနိုင်စေရန်"]],
[["6. being aware of how much time is available, in order to adjust the length of one's interaction","၆။ ရနိုင်သည့် အချိန်ကို သတိထား၍ မိမိ၏ပြောဆိုမှု အရှည်အတိုကို ညှိနိုင်ရန်"]],
[["7. making one's communication relevant to the topic being discussed to maintain the attention of one's audience","၇။ နားထောင်သူ၏ အာရုံကို ဆက်လက်ဖမ်းစားထားရန် ဆွေးနွေးနေသည့်ခေါင်းစဉ်နှင့် ဆက်စပ်စေရန်"]],
[["8. making one's communication well-organised to make it comprehensible to the audience","၈။ နားထောင်သူ နားလည်လွယ်စေရန် မိမိ၏ပြောဆိုမှုကို စနစ်တကျ စီစဉ်ထားရန်"]],
[["9. giving turns to talk to one's listener(s), so that one will not be regarded as dominating the interaction too much","၉။ မိမိက ဆက်ဆံမှုကို လွန်ကဲစွာ လွှမ်းမိုးသူအဖြစ် မမြင်စေရန် နားထောင်သူ(များ)ကို စကားပြောရန် အလှည့်ပေးရန်"]],
[["10. giving examples, relevant to the topic and participants, and injecting a bit of humour, when and where appropriate, to make the interaction interesting","၁၀။ ဆက်ဆံမှု စိတ်ဝင်စားဖွယ်ဖြစ်စေရန် ခေါင်းစဉ်နှင့် ပါဝင်သူများနှင့် သက်ဆိုင်သော ဥပမာများပေး၍ သင့်လျော်သည့်အချိန်၊ နေရာတွင် ဟာသအနည်းငယ် ထည့်သွင်းရန်"]],
[["11. using polite language to show one's regard for one's audience and to create rapport","၁၁။ နားထောင်သူကို လေးစားကြောင်းပြရန်နှင့် ရင်းနှီးမှုတည်ဆောက်ရန် ယဉ်ကျေးသောစကားကို သုံးရန်"]],
[["12. using appropriate tone of voice, body language, gestures, and posture to enhance the interest of the audience","၁၂။ နားထောင်သူ၏ စိတ်ဝင်စားမှုကို မြှင့်တင်ရန် သင့်လျော်သော အသံနေအသံထား၊ ခန္ဓာကိုယ်ဘာသာစကား၊ လက်ဟန်ခြေဟန်နှင့် ထိုင်နေပုံကို သုံးရန်"]],
[["In order to promote the above-mentioned qualities in students to enhance their communication skills, schools and universities will need to give sustained attention to their development.","အထက်ပါ အရည်အသွေးများကို ကျောင်းသားများတွင် မြှင့်တင်၍ ၎င်းတို့၏ ဆက်သွယ်ပြောဆိုနိုင်စွမ်း တိုးတက်စေရန် ကျောင်းများနှင့် တက္ကသိုလ်များသည် ၎င်းတို့၏ ဖွံ့ဖြိုးတိုးတက်မှုကို ဆက်တိုက် အာရုံစိုက်ပေးရန် လိုအပ်မည်။"],
["Schools will need to create a culture of interaction from the very first day students enter school.","ကျောင်းများသည် ကျောင်းသားများ ကျောင်းစတက်သည့် ပထမဆုံးနေ့မှစ၍ အပြန်အလှန်ဆက်ဆံသည့် ယဉ်ကျေးမှုကို ဖန်တီးရန် လိုအပ်မည်။"],
["Teachers should begin their training on communication at the lower primary level by asking students questions and by answering their questions patiently and maintaining young children's eagerness to talk.","ဆရာ/ဆရာမများသည် မူလတန်းအောက်ပိုင်းမှစ၍ ကျောင်းသားများကို မေးခွန်းမေးခြင်း၊ ၎င်းတို့၏မေးခွန်းများကို စိတ်ရှည်လက်ရှည်ဖြေခြင်းနှင့် ကလေးငယ်များ၏ စကားပြောလိုစိတ်ကို ထိန်းသိမ်းပေးခြင်းဖြင့် ဆက်သွယ်ပြောဆိုမှု သင်တန်းကို စတင်သင့်သည်။"]]

var fs=1,startDist=0,startFs=1;
function dist(e){var dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;return Math.sqrt(dx*dx+dy*dy)}
function setFs(v){fs=Math.min(2.2,Math.max(0.7,v));document.documentElement.style.setProperty("--fs",fs)}
document.addEventListener("touchstart",function(e){if(e.touches.length===2){startDist=dist(e);startFs=fs}},{passive:true});
document.addEventListener("touchmove",function(e){if(e.touches.length===2&&startDist>0){e.preventDefault();setFs(startFs*dist(e)/startDist)}},{passive:false});
document.addEventListener("touchend",function(e){if(e.touches.length<2)startDist=0},{passive:true});
